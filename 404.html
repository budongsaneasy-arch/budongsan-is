<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>부동산이즈</title>
<!--
  없는 주소로 들어온 방문자를 가까운 화면으로 보냅니다.

  GitHub Pages는 매칭되지 않는 모든 경로에 이 파일을 돌려줍니다.
  2026-10-25 재구축 때 주소가 경로형에서 해시형으로 바뀌었다가, 2026-11-03에 다시
  화면별 경로형(/why/ 처럼)으로 돌아왔습니다. 그 사이의 주소들이 아직 돌아다닙니다.

  화면을 추가하면 _src/pages.json 에 넣고 아래 ROUTES 에도 같은 이름을 넣어 주세요.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#121826;background:#fff;
       text-align:center;padding:24px;line-height:1.7;word-break:keep-all}
  a{color:#1C335E;font-weight:700}
</style>
<script>
(function () {
  var ROUTES = ['why','join','stories','partners','brand','faculty','news','contact','privacy'];

  // 경로를 정리합니다: 앞뒤 슬래시와 .html 꼬리표를 떼고 소문자로
  var path = location.pathname
    .replace(/^\/+|\/+$/g, '')
    .replace(/\.html?$/i, '')
    .toLowerCase();

  var to = '/';
  if (path) {
    var seg = path.split('/');
    if (seg[0] === 'news' && seg[1]) {
      // 게시글 주소는 아이디까지 살립니다 (/news/현장실습 → /news/#news/현장실습)
      to = '/news/#news/' + seg.slice(1).join('/');
    } else if (ROUTES.indexOf(seg[0]) !== -1) {
      to = '/' + seg[0] + '/';
    }
    // 아는 화면이 아니면 첫 화면으로 보냅니다
  }

  // 유입 경로 추적용 쿼리(utm 등)는 그대로 넘깁니다
  var q = location.search;
  var h = to.indexOf('#');
  location.replace(h === -1 ? to + q : to.slice(0, h) + q + to.slice(h));
})();
</script>
</head>
<body>
  <div>
    <p><strong>부동산이즈</strong></p>
    <p>주소가 바뀌었습니다. 잠시 후 이동합니다.</p>
    <p><a href="/">홈으로 바로 가기</a></p>
  </div>
</body>
</html>
