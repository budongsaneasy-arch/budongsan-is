<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>부동산이즈</title>
<!--
  옛 사이트의 경로형 주소(/partners 같은)를 지금의 해시 주소(/#partners)로 넘깁니다.

  GitHub Pages는 매칭되지 않는 모든 경로에 이 파일을 돌려줍니다. 2026-10-25 재구축 때
  URL 구조가 경로형에서 해시형으로 바뀌면서, 구글에 색인된 옛 주소가 전부 죽었습니다.
  이 파일 하나로 그 주소들이 다시 해당 화면으로 연결됩니다.

  화면을 추가하면 아래 ROUTES 에 이름을 넣어 주세요.
-->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#121826;background:#fff;
       text-align:center;padding:24px;line-height:1.7;word-break:keep-all}
  a{color:#1C335E;font-weight:700}
</style>
<script>
(function () {
  var ROUTES = ['home','why','join','stories','partners','brand','faculty','news','contact','privacy'];

  // 경로를 정리합니다: 앞뒤 슬래시와 .html 꼬리표를 떼고 소문자로
  var path = location.pathname
    .replace(/^\/+|\/+$/g, '')
    .replace(/\.html?$/i, '')
    .toLowerCase();

  var hash = '';
  if (path) {
    var seg = path.split('/');
    if (seg[0] === 'news' && seg[1]) {
      // 게시글 주소는 아이디까지 살립니다 (/news/field-practice → /#news/field-practice)
      hash = '#news/' + seg.slice(1).join('/');
    } else if (ROUTES.indexOf(seg[0]) !== -1) {
      hash = '#' + seg[0];
    }
    // 아는 화면이 아니면 hash 를 비워 두어 첫 화면으로 보냅니다
  }

  // 유입 경로 추적용 쿼리(utm 등)는 그대로 넘깁니다
  location.replace('/' + location.search + hash);
})();
</script>
</head>
<body>
  <div>
    <p><strong>부동산이즈</strong></p>
    <p>주소가 바뀌었습니다. 잠시 후 홈으로 이동합니다.</p>
    <p><a href="/">바로 이동하기</a></p>
  </div>
</body>
</html>
